<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a59"><link rel="manifest" href="manifest.webmanifest"><title>ドコモメール検索 iPhone</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6f9;color:#142a3c;margin:0}header{background:#173a59;color:white;padding:20px}main{max-width:740px;margin:auto;padding:16px}.panel{background:white;padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 1px 5px #ccd5dd}input,select,button{font:inherit;padding:12px;box-sizing:border-box;border-radius:8px;border:1px solid #c6d2dc;width:100%;margin:5px 0}button{background:#1762a1;color:white;border:0;font-weight:600}label{display:block;margin-top:10px;font-size:14px}.note{color:#5c6b76;font-size:13px;line-height:1.5}.mail{border-top:1px solid #dce4e9;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.mail small{color:#607080}summary{cursor:pointer;font-weight:600}h1{font-size:22px;margin:0}h2{font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}a{color:#1762a1}</style></head><body><header><h1>ドコモメール検索</h1><div>iPhone版・ローカル検索</div></header><main><section class="panel"><strong>この版でできること</strong><p class="note">iPhoneの「ファイル」から .eml メールファイル、テキスト選択可能なPDFを読み込み、端末内で検索できます。ドコモメールへの自動接続はまだありません。メールはサーバーに送信しません。画像だけのPDFはOCR対象外です。</p><label>メールファイル（.eml）を読み込む<input type="file" id="eml" accept=".eml,message/rfc822" multiple></label><label>PDFを読み込む<input type="file" id="pdf" accept="application/pdf,.pdf" multiple></label><div id="status" class="note"></div></section><section class="panel"><h2>検索条件</h2><label>キーワード<input id="q" placeholder="例：昆布 注文"></label><label>対象<select id="field"><option value="all">すべて（送信者・件名・本文・PDF）</option><option value="from">送信者</option><option value="subject">件名</option><option value="body">本文</option><option value="pdf">PDF本文</option></select></label><label>検索方式<select id="logic"><option value="and">AND（すべて含む）</option><option value="or">OR（いずれか含む）</option></select></label><div class="grid"><label>開始日<input id="start" type="date"></label><label>終了日<input id="end" type="date"></label></div><button id="search">検索</button></section><section class="panel"><h2>検索結果 <span id="count"></span></h2><div id="results"></div><button id="clear" style="background:#647585">端末内の取込データを削除</button></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script type="module">
import * as pdfjs from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);let records=[];const DB='docomo-mail-local-v1';function db(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function put(item){let d=await db();await new Promise((res,rej)=>{let t=d.transaction('items','readwrite');t.objectStore('items').put(item);t.oncomplete=res;t.onerror=()=>rej(t.error)});d.close()}async function load(){let d=await db();records=await new Promise((res,rej)=>{let r=d.transaction('items').objectStore('items').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});d.close();search()}
function parseEML(t,name){let pos=t.search(/\r?\n\r?\n/);let head=pos<0?t:t.slice(0,pos),body=pos<0?'':t.slice(pos).trim();let get=k=>{let m=head.match(new RegExp('^'+k+':\\s*(.*(?:\\r?\\n[ \\t]+.*)*)','im'));return m?m[1].replace(/\r?\n\s+/g,' '):''};let date=new Date(get('Date'));return {id:'eml-'+name+'-'+t.length+'-'+t.slice(0,100),type:'eml',name,from:get('From'),subject:get('Subject')||name,date:isNaN(date)?'':date.toISOString().slice(0,10),body,pdf:''}}
$('eml').onchange=async e=>{for(let f of e.target.files){let t=await f.text();await put(parseEML(t,f.name))}$('status').textContent='メールを読み込みました';load()};$('pdf').onchange=async e=>{for(let f of e.target.files){try{let p=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let txt=[];for(let i=1;i<=p.numPages;i++){let page=await p.getPage(i);let c=await page.getTextContent();txt.push(c.items.map(x=>x.str).join(' '))}await put({id:'pdf-'+f.name+'-'+f.size+'-'+f.lastModified,type:'pdf',name:f.name,from:'',subject:f.name,date:new Date(f.lastModified).toISOString().slice(0,10),body:'',pdf:txt.join('\n')})}catch(err){$('status').textContent='PDF読取失敗: '+f.name+' '+err.message}}load()};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function search(){let words=$('q').value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean),field=$('field').value,logic=$('logic').value,start=$('start').value,end=$('end').value;let matches=records.filter(r=>{if(start&&r.date&&r.date<start||end&&r.date&&r.date>end)return false;let hay=(field==='all'?[r.from,r.subject,r.body,r.pdf]:[r[field]||'']).join(' ').toLocaleLowerCase();return !words.length||(logic==='and'?words.every(w=>hay.includes(w)):words.some(w=>hay.includes(w)))});$('count').textContent='('+matches.length+'件 / 保存'+records.length+'件)';$('results').innerHTML=matches.slice(0,200).map(r=>'<details class="mail"><summary>'+esc(r.subject)+'</summary><small>'+esc(r.date)+' '+esc(r.from)+' / '+esc(r.name)+'</small><p>'+esc((r.body||r.pdf).slice(0,12000))+'</p></details>').join('')||'<p class="note">該当データがありません。</p>'}for(let id of ['q','field','logic','start','end'])$(id).addEventListener('input',search);$('search').onclick=search;$('clear').onclick=async()=>{if(!confirm('取り込んだ検索データをすべて削除しますか？'))return;indexedDB.deleteDatabase(DB);records=[];search()};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
